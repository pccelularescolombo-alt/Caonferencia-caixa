<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Fechamento de Caixa • Pinheirinho Celulares</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --azul:#0d3bff;
  --laranja:#ff6a00;
  --fundo:#f2f4f7;
  --borda:#d6d9de;
}

*{box-sizing:border-box}

body{
  margin:0;
  padding:10px;
  font-family:"Segoe UI", Arial, sans-serif;
  background:var(--fundo);
  color:#222;
}

/* ===== TELA ===== */
header{
  text-align:center;
  margin-bottom:8px;
}

header img{
  max-width:140px;
  margin-bottom:4px;
}

header h1{
  font-size:16px;
  margin:0;
}

.container{
  max-width:980px;
  margin:auto;
  display:flex;
  gap:10px;
  justify-content:center;
}

.box{
  background:#fff;
  border:1px solid var(--borda);
  border-radius:8px;
  padding:8px;
  width:300px;
}

.box h2{
  font-size:13px;
  text-align:center;
  margin:4px 0 6px;
  color:var(--azul);
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:11.5px;
}

th,td{
  border:1px solid var(--borda);
  padding:3px;
  text-align:center;
}

th{
  background:var(--azul);
  color:#fff;
}

td input{
  width:42px;
  padding:3px;
  font-size:11px;
}

.linha{
  margin-bottom:4px;
}

.linha label{
  font-size:11.5px;
}

.linha input{
  width:100%;
  padding:4px;
  font-size:12px;
}

.total{
  font-weight:bold;
  background:#f4f6fa;
}

.resultado{
  margin-top:6px;
  padding:5px;
  border-radius:5px;
  font-size:12px;
  text-align:center;
  background:#f9faff;
  border-left:4px solid var(--laranja);
}

.acoes{
  text-align:center;
  margin-top:10px;
}

button{
  background:var(--azul);
  color:#fff;
  border:none;
  padding:8px 16px;
  border-radius:6px;
  font-size:13px;
  cursor:pointer;
}

footer{
  margin-top:8px;
  text-align:center;
  font-size:11.5px;
  color:#555;
}

/* ===== IMPRESSÃO TÉRMICA ===== */
@media print{
  @page{
    size:78mm 295mm;
    margin:0;
  }

  body{
    background:#fff;
    padding:0;
    width:78mm;
  }

  header img{
    max-width:90px;
  }

  header h1{
    font-size:13px;
  }

  .container{
    display:block;
    max-width:100%;
  }

  .box{
    width:100%;
    border:none;
    border-bottom:1px dashed #000;
    border-radius:0;
    padding:6px 4px;
    margin-bottom:6px;
  }

  table{
    font-size:10px;
  }

  th,td{
    padding:2px;
  }

  td input{
    display:none;
  }

  .resultado{
    font-size:11px;
    border-left:none;
    border-top:1px solid #000;
    background:none;
  }

  .acoes,
  button{
    display:none;
  }

  footer{
    font-size:10px;
    margin-top:6px;
  }
}
</style>
</head>

<body>

<header>
  <img src="amg/logo.png" alt="Pinheirinho Celulares">
  <h1>Fechamento de Caixa</h1>
</header>

<div class="container">

<div class="box">
<h2>💵 Dinheiro (Contagem)</h2>
<table>
<thead>
<tr><th>Nota</th><th>Qtd</th><th>Total</th></tr>
</thead>
<tbody id="linhas"></tbody>
<tfoot>
<tr class="total">
<td colspan="2">Total</td>
<td id="totalContado">R$ 0,00</td>
</tr>
</tfoot>
</table>
</div>

<div class="box">
<h2>📊 Dinheiro (Sistema)</h2>
<div class="linha"><label>Abertura</label><input type="number" step="0.01" id="abertura"></div>
<div class="linha"><label>Suprimento</label><input type="number" step="0.01" id="suprimento"></div>
<div class="linha"><label>Sangria</label><input type="number" step="0.01" id="sangria"></div>
<div class="linha"><label>Valor no sistema</label><input type="number" step="0.01" id="sistemaDinheiro"></div>
<div class="resultado" id="resultadoDinheiro">Informe os valores</div>
</div>

<div class="box">
<h2>💳 Cartão</h2>
<div class="linha"><label>Maquininha 1</label><input type="number" step="0.01" id="maq1"></div>
<div class="linha"><label>Maquininha 2</label><input type="number" step="0.01" id="maq2"></div>
<div class="linha"><label>Valor no sistema</label><input type="number" step="0.01" id="sistemaCartao"></div>
<div class="resultado" id="resultadoCartao">Informe os valores</div>
</div>

</div>

<div class="acoes">
<button onclick="window.print()">🖨️ Imprimir</button>
</div>

<footer>
Programa desenvolvido por <strong>Mattheus Avilar</strong>
</footer>

<script>
const valores=[200,100,50,20,10,5,2,1,0.5,0.25,0.1,0.05];
const tbody=document.getElementById("linhas");

valores.forEach(v=>{
  tbody.innerHTML+=`
  <tr>
    <td>R$ ${v.toFixed(2).replace(".",",")}</td>
    <td><input type="number" data-v="${v}" oninput="calc()"></td>
    <td class="linhaTotal">R$ 0,00</td>
  </tr>`;
});

document.querySelectorAll("input").forEach(i=>i.addEventListener("input",calc));

function calc(){
  let total=0;
  document.querySelectorAll("#linhas tr").forEach(tr=>{
    const i=tr.querySelector("input");
    const v=+i.dataset.v;
    const q=+i.value||0;
    const s=v*q;
    tr.querySelector(".linhaTotal").innerText="R$ "+s.toFixed(2).replace(".",",");
    total+=s;
  });
  totalContado.innerText="R$ "+total.toFixed(2).replace(".",",");

  const ab=+abertura.value||0;
  const sup=+suprimento.value||0;
  const sa=+sangria.value||0;
  const sd=+sistemaDinheiro.value;

  if(!isNaN(sd)){
    const esp=ab+sup-sa+sd;
    const d=total-esp;
    resultadoDinheiro.innerText=
      d===0?"DINHEIRO OK":
      d>0?"SOBRA R$ "+d.toFixed(2).replace(".",","):
      "FALTA R$ "+Math.abs(d).toFixed(2).replace(".",",");
  }

  const m1=+maq1.value||0;
  const m2=+maq2.value||0;
  const sc=+sistemaCartao.value;

  if(!isNaN(sc)){
    const d=(m1+m2)-sc;
    resultadoCartao.innerText=
      d===0?"CARTÃO OK":
      d>0?"SOBRA R$ "+d.toFixed(2).replace(".",","):
      "FALTA R$ "+Math.abs(d).toFixed(2).replace(".",",");
  }
}
</script>

</body>
</html>
